<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Join as Pandit | PanditGo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins&display=swap" rel="stylesheet">

  <style>
    body{
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg,#fff7ed,#ffffff);
      min-height:100vh;
    }
    .hero{
      padding:100px 0 60px;
      text-align:center;
    }
    .hero h1{
      font-family:'Playfair Display',serif;
      font-size:3.5rem;
      color:#8B0000;
    }
    .card{
      border-radius:20px;
      box-shadow:0 20px 40px rgba(0,0,0,0.08);
    }
    .btn-pandit{
      background:#FF9933;
      color:#000;
      font-weight:600;
      border-radius:50px;
      padding:14px 40px;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-danger fs-3" href="index.html">PanditGo</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Become a Verified Pandit</h1>
  <p class="lead mt-3">Join India’s fastest growing spiritual platform</p>
</section>

<!-- FORM -->
<div class="container pb-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card p-4">
        <form>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Mobile Number</label>
            <input type="tel" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">City</label>
            <input type="text" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Specialization</label>
            <select class="form-select">
              <option>Puja</option>
              <option>Astrology</option>
              <option>Kundli</option>
              <option>Vastu</option>
            </select>
          </div>

          <div class="text-center mt-4">
            <button type="submit" class="btn btn-pandit">
              Apply as Pandit
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
</html>
