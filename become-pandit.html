<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>join as pandit - BookMyPandit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #1a0000, #3b0a0a); color: #f5e6c8; min-height: 100vh; }
        .form-container { max-width: 700px; margin: 80px auto; background: rgba(255,255,255,0.07); backdrop-filter: blur(15px); border-radius: 25px; padding: 50px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        h2 { font-family: 'Playfair Display', serif; color: #ffcc66; text-align: center; margin-bottom: 40px; }
        .form-label { color: #ffd27f; font-weight: 500; }
        .form-control, .form-select { background: rgba(255,255,255,0.1); border: 1px solid #ff9933; color: #fff; border-radius: 12px; padding: 14px; }
        .form-control:focus, .form-select:focus { background: rgba(255,255,255,0.15); border-color: #ffd27f; box-shadow: 0 0 0 0.25rem rgba(255,153,51,0.25); color: #fff; }
        .btn-submit { background: linear-gradient(135deg, #ff9933, #ffd27f); border: none; font-weight: 600; padding: 14px; border-radius: 50px; transition: all 0.3s; }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,153,51,0.4); }
        .file-upload { background: rgba(255,255,255,0.1); border: 2px dashed #ff9933; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; }
        .file-upload:hover { background: rgba(255,153,51,0.1); }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Become a Verified Pandit</h2>

    <form id="panditForm">
        <div class="row g-4">
            <div class="col-md-6">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="col-md-6">
                <label for="phone" class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" id="phone" placeholder="+91" required>
            </div>
            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="col-md-6">
                <label for="city" class="form-label">City / Area</label>
                <input type="text" class="form-control" id="city" required>
            </div>
        </div>

        <div class="row g-4 mt-3">
            <div class="col-md-6">
                <label for="experience" class="form-label">Years of Experience</label>
                <input type="number" class="form-control" id="experience" min="1" required>
            </div>
            <div class="col-md-6">
                <label for="languages" class="form-label">Languages Known</label>
                <input type="text" class="form-control" id="languages" placeholder="Hindi, Gujarati, Sanskrit" required>
            </div>
        </div>

        <div class="mt-4">
            <label class="form-label">Specialization (Puja Types)</label>
            <select class="form-select" multiple id="specialization" required>
                <option>Griha Pravesh</option>
                <option>Satyanarayan Katha</option>
                <option>Rudrabhishek</option>
                <option>Marriage Puja</option>
                <option>Navgrah Shanti</option>
                <option>Kundli Making</option>
                <option>Havan</option>
                <option>Other</option>
            </select>
        </div>

        <div class="mt-4">
            <label class="form-label">Upload ID Proof (Aadhar / PAN)</label>
            <div class="file-upload">
                <input type="file" id="idProof" accept="image/*" hidden>
                <p>Click or drag file here</p>
            </div>
        </div>

        <div class="mt-4">
            <label class="form-label">Bank / UPI Details (for payout)</label>
            <input type="text" class="form-control" id="bankDetails" placeholder="UPI ID or Account No. + IFSC" required>
        </div>

        <div class="form-check mt-4">
            <input type="checkbox" class="form-check-input" id="agree" required>
            <label class="form-check-label" for="agree">
                I agree to the <a href="terms-of-service.html" class="link-light">Terms of Service</a> & <a href="privacy-policy.html" class="link-light">Privacy Policy</a>
            </label>
        </div>

        <button type="submit" class="btn btn-submit w-100 mt-4">Submit Application</button>
    </form>

    <p class="text-center mt-4">
        Application will be reviewed by admin within 24-48 hours.
    </p>
</div>

<script>
    document.getElementById("panditForm").addEventListener("submit", function(e) {
        e.preventDefault();
        alert("Application submitted successfully! Admin will review it soon.");
        // Future me backend call (become-pandit endpoint)
        // window.location.href = "thank-you.html";
    });
</script>
</body>
</html>
