<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Become a Pandit - PanditGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(to bottom, #f8f2eb, #fff); font-family: 'Poppins', sans-serif; }
        .card { border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
        .btn-success { background: #28a745; border: none; }
    </style>
</head>
<body>

    <section class="py-5">
        <div class="container">
            <div class="text-center mb-5">
                <h1 class="display-4 fw-bold text-primary">Join as Verified Pandit 🙏</h1>
                <p class="lead text-muted">Get verified • Receive bookings • Earn respectfully</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card shadow-lg p-5">
                        <form id="becomePanditForm">
                            <h4 class="mb-4 text-primary">Personal Details</h4>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Full Name</label>
                                    <input type="text" class="form-control form-control-lg rounded-pill" id="panditName" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Mobile Number</label>
                                    <input type="tel" class="form-control form-control-lg rounded-pill" id="panditPhone" maxlength="10" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Email (optional)</label>
                                    <input type="email" class="form-control form-control-lg rounded-pill" id="panditEmail">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">City</label>
                                    <select class="form-select form-select-lg rounded-pill" id="panditCity" required>
                                        <option value="">Select City</option>
                                        <option>Ahmedabad</option>
                                        <option>Surat</option>
                                        <option>Mumbai</option>
                                        <option>Delhi</option>
                                        <option>Jaipur</option>
                                    </select>
                                </div>
                            </div>

                            <h4 class="mb-4 text-primary">Experience & Skills</h4>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Years of Experience</label>
                                    <input type="number" class="form-control form-control-lg rounded-pill" id="panditExp" min="1" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Languages Spoken</label>
                                    <input type="text" class="form-control form-control-lg rounded-pill" id="panditLang" placeholder="Hindi, Gujarati, Sanskrit" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">Pujas You Specialize In</label>
                                    <input type="text" class="form-control form-control-lg rounded-pill" id="panditPujas" placeholder="Griha Pravesh, Satyanarayan Katha, Rudrabhishek" required>
                                </div>
                            </div>

                            <h4 class="mb-4 text-primary">Documents (Demo – File Upload Simulate)</h4>
                            <div class="row g-3 mb-5">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Profile Photo</label>
                                    <input type="file" class="form-control form-control-lg" id="profilePhoto" accept="image/*">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Aadhaar / ID Proof</label>
                                    <input type="file" class="form-control form-control-lg" id="aadharCard" accept="image/*,application/pdf">
                                </div>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-success btn-lg rounded-pill px-5 py-3 fw-bold w-100">
                                    Submit Application for Verification
                                </button>
                                <p class="mt-3 text-muted">Admin will verify in 24-48 hours • You'll get notified once approved</p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('becomePanditForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Collect form data
            const name = document.getElementById('panditName').value.trim();
            const phone = document.getElementById('panditPhone').value.trim();
            const email = document.getElementById('panditEmail').value.trim();
            const city = document.getElementById('panditCity').value;
            const exp = parseInt(document.getElementById('panditExp').value);
            const lang = document.getElementById('panditLang').value.trim();
            const pujas = document.getElementById('panditPujas').value.trim();

            if (!name || !phone || !city || isNaN(exp)) {
                return alert("Please fill all required fields!");
            }

            // Load existing data or create new
            let appData = JSON.parse(localStorage.getItem('appData')) || { pandits: [] };

            // Generate new ID
            const newId = `PT${String(appData.pandits.length + 1).padStart(3, '0')}`;

            // Add new pandit request
            appData.pandits.push({
                id: newId,
                name,
                phone,
                email,
                city,
                exp,
                lang,
                pujas,
                status: 'Pending',
                photo: 'https://via.placeholder.com/150?text=Pandit' // Default placeholder
            });

            // Save back to localStorage
            localStorage.setItem('appData', JSON.stringify(appData));

            alert(`Thank you ${name}! Your application has been submitted.\nAdmin will review soon. 🙏`);
            this.reset(); // Clear form
        });
    </script>
</body>
</html>
