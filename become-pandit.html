<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Become a Pandit - BookMyPandit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar same as home (copy paste kar le) -->

    <section class="py-5 bg-light">
        <div class="container">
            <div class="text-center mb-5">
                <h1 class="display-4 fw-bold text-primary">Join as Verified Pandit</h1>
                <p class="lead">Get bookings from your city • Earn with respect • Flexible schedule • Transparent payments</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card shadow-lg p-5">
                        <form>
                            <!-- Personal Info -->
                            <h4 class="mb-4 text-primary">Personal Information</h4>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Full Name</label>
                                    <input type="text" class="form-control form-control-lg rounded-pill" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Mobile Number</label>
                                    <input type="tel" class="form-control form-control-lg rounded-pill" maxlength="10" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Email (optional)</label>
                                    <input type="email" class="form-control form-control-lg rounded-pill">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">City</label>
                                    <select class="form-select form-select-lg rounded-pill">
                                        <option>Ahmedabad</option>
                                        <option>Surat</option>
                                        <option>Mumbai</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Experience -->
                            <h4 class="mb-4 text-primary">Experience & Expertise</h4>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Years of Experience</label>
                                    <select class="form-select form-select-lg rounded-pill">
                                        <option>5-10 years</option>
                                        <option>10-15 years</option>
                                        <option>15-20 years</option>
                                        <option>20+ years</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Languages</label>
                                    <select class="form-select form-select-lg rounded-pill" multiple>
                                        <option>Hindi</option>
                                        <option>Sanskrit</option>
                                        <option>Gujarati</option>
                                        <option>English</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">Pujas You Perform</label>
                                    <div class="row g-3">
                                        <div class="col-md-4 form-check">
                                            <input class="form-check-input" type="checkbox">
                                            <label>Griha Pravesh</label>
                                        </div>
                                        <div class="col-md-4 form-check">
                                            <input class="form-check-input" type="checkbox">
                                            <label>Satyanarayan Katha</label>
                                        </div>
                                        <div class="col-md-4 form-check">
                                            <input class="form-check-input" type="checkbox">
                                            <label>Rudrabhishek</label>
                                        </div>
                                        <!-- Aur pujas add kar -->
                                    </div>
                                </div>
                            </div>

                            <!-- Documents -->
                            <h4 class="mb-4 text-primary">Upload Documents</h4>
                            <div class="row g-3 mb-5">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Profile Photo</label>
                                    <input type="file" class="form-control form-control-lg" accept="image/*" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Aadhar Card</label>
                                    <input type="file" class="form-control form-control-lg" accept="image/*,application/pdf" required>
                                </div>
                            </div>

                            <!-- Submit -->
                            <div class="text-center">
                                <button type="submit" class="btn btn-success btn-lg rounded-pill px-5 py-3 fw-bold w-100">
                                    Submit Application
                                </button>
                                <p class="mt-3 text-muted">Admin verify karega 48 hours me • Approval pe email/SMS aayega • Bookings start!</p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Application Submitted! Admin verify karega 🙏');
        });
    </script>
</body>
</html>
