<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandits - BookMyPandit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        :root {
            --background: #FFFDF8; /* Off-white/ivory */
            --primary: #C9A24D; /* Soft gold */
            --text: #2E2E2E; /* Charcoal */
            --muted: #7A7A7A; /* Muted gray */
            --accent: #E9D8A6; /* Light gold */
            --border: #F0F0F0;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--background);
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(201, 162, 77, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(233, 216, 166, 0.02) 0%, transparent 50%);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Minimal Navbar */
        .navbar {
            background: var(--background);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary) !important;
        }

        .navbar-nav .nav-link {
            color: var(--text) !important;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .navbar-nav .nav-link:hover {
            color: var(--primary) !important;
        }

        .navbar-nav .nav-link.active {
            color: var(--primary) !important;
            font-weight: 600;
        }

        /* Main Content */
        .main-content {
            padding-top: 100px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Section Header */
        .section-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
        }

        .section-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .section-header p {
            font-size: 1.1rem;
            color: var(--muted);
            max-width: 500px;
            margin: 0 auto;
        }

        /* Pandit Cards - Clean & Simple */
        .pandit-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .pandit-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        /* Pandit Image */
        .pandit-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px 8px 0 0;
            transition: opacity 0.5s ease;
        }

        /* Card Content */
        .card-content {
            padding: 1.5rem;
        }

        .pandit-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .pandit-meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            color: var(--muted);
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .specialization {
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .btn-action {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            min-width: 120px;
        }

        .btn-action:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(201, 162, 77, 0.3);
        }

        .btn-chat {
            border-color: #25D366;
            color: #25D366;
        }

        .btn-chat:hover {
            background: #25D366;
            border-color: #25D366;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }

        .btn-call {
            border-color: #007bff;
            color: #007bff;
        }

        .btn-call:hover {
            background: #007bff;
            border-color: #007bff;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        }

        /* Book Button */
        .btn-book {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            border: 2px solid var(--primary);
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-book:hover {
            background: white;
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(201, 162, 77, 0.3);
        }

        .btn-book::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-book:hover::before {
            left: 100%;
        }

        /* Error Message */
        .no-pandit-msg {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            color: var(--muted);
            font-size: 1.1rem;
            box-shadow: var(--shadow);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .section-header h1 {
                font-size: 2.2rem;
            }

            .pandit-image {
                height: 220px;
            }

            .pandit-name {
                font-size: 1.3rem;
            }

            .pandit-meta {
                flex-direction: column;
                gap: 0.5rem;
            }

            .pricing-info {
                flex-direction: column;
                gap: 1rem;
            }

            .action-buttons {
                flex-direction: column;
                gap: 0.75rem;
            }

            .btn-action {
                width: 100%;
                min-width: unset;
            }

            .btn-book {
                padding: 0.875rem 1.25rem;
                font-size: 0.95rem;
            }
        }

        /* Fade-in Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pandit-card {
            animation: fadeIn 0.6s ease-out;
        }

        .pandit-card:nth-child(1) { animation-delay: 0.1s; }
        .pandit-card:nth-child(2) { animation-delay: 0.2s; }
        .pandit-card:nth-child(3) { animation-delay: 0.3s; }
        .pandit-card:nth-child(4) { animation-delay: 0.4s; }
        .pandit-card:nth-child(5) { animation-delay: 0.5s; }
        .pandit-card:nth-child(6) { animation-delay: 0.6s; }
        .pandit-card:nth-child(7) { animation-delay: 0.7s; }
    </style>
</head>
<body>

<!-- Minimal Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">BookMyPandit</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="pandits.html">Pandits</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="main-content">
    <div class="container">
        <div class="section-header">
            <h1>Our Verified Pandits 🙏</h1>
            <p>Trusted, experienced & verified pandits for your sacred rituals</p>
        </div>

        <div class="row g-4" id="panditsList">
            <!-- Pandits will be loaded dynamically from JSON -->
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="frontend/js/pandits.js"></script>
</body>
</html>
