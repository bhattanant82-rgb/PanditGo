<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janam Kundli Generator - BookMyPandit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(to bottom, #4B0000, #8B0000); color: #f5e8d3; }
        .container { max-width: 1000px; margin: auto; padding: 60px 20px; }
        .hero { text-align: center; }
        .hero h1 { font-family: 'Playfair Display', serif; color: #FF9933; font-size: 3.5rem; }
        .form-box { background: rgba(255,153,51,0.08); border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .output { background: rgba(10,10,30,0.85); border-radius: 20px; padding: 40px; margin-top: 50px; }
        .card { background: rgba(255,255,255,0.08); border: none; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .loading { text-align: center; color: #FF9933; font-size: 1.4rem; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
    </style>
</head>
<body>

    <section class="hero">
        <div class="container">
            <h1>Janam Kundli Generator</h1>
            <p class="lead mt-3">Accurate Vedic Kundli • Real Astrology Insights</p>
        </div>
    </section>

    <section class="container">
        <div class="form-box mx-auto">
            <h2 class="text-center mb-4" style="color: #FF9933;">Enter Birth Details</h2>
            <form id="kundliForm">
                <div class="row g-4">
                    <div class="col-md-4">
                        <label for="dob" class="form-label">Date of Birth (DD/MM/YYYY)</label>
                        <input type="text" class="form-control" id="dob" placeholder="01/01/2000" required>
                    </div>
                    <div class="col-md-4">
                        <label for="tob" class="form-label">Time of Birth (HH:MM)</label>
                        <input type="text" class="form-control" id="tob" placeholder="12:00" required>
                    </div>
                    <div class="col-md-4">
                        <label for="place" class="form-label">Place (lat,long)</label>
                        <input type="text" class="form-control" id="place" placeholder="23.0225,72.5714" required>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-warning btn-lg px-5 py-3 fw-bold">Generate Kundli</button>
                </div>
            </form>
        </div>

        <div class="output d-none" id="output">
            <h2 class="text-center mb-4" style="color: #FF9933;">Your Janam Kundli</h2>
            <div class="loading" id="loading">🔮 Generating Kundli...</div>
            <div class="result-grid" id="result"></div>
        </div>
    </section>

    <script>
        document.getElementById("kundliForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const output = document.getElementById("output");
            const result = document.getElementById("result");
            const loading = document.getElementById("loading");

            output.classList.remove("d-none");
            loading.style.display = "block";
            result.innerHTML = "";

            const dob = document.getElementById("dob").value;
            const tob = document.getElementById("tob").value;
            const place = document.getElementById("place").value;

            try {
                const res = await fetch('http://127.0.0.1:5000/generate-kundli', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({dob, tob, place})
                });

                const json = await res.json();

                if (json.error) {
                    result.innerHTML = `<div class="text-danger text-center">Error: ${json.error}</div>`;
                    return;
                }

                result.innerHTML = `<div class="card">
                    <h4>Lagna</h4>
                    <p>Rashi: ${json.lagna.rashi}</p>
                    <p>Nakshatra: ${json.lagna.nakshatra}</p>
                    <p>Degree: ${json.lagna.degree}</p>
                </div>`;

                result.innerHTML += `<div class="card">
                    <h4>Current Dasha</h4>
                    <p>Lord: ${json.current_dasha.lord}</p>
                    <p>Effect: ${json.current_dasha.effect}</p>
                </div>`;

                result.innerHTML += `<div class="card">
                    <h4>Predictions</h4>
                    <p>Career: ${json.predictions.career}</p>
                    <p>Money: ${json.predictions.money}</p>
                    <p>Marriage: ${json.predictions.marriage}</p>
                    <p>Health: ${json.predictions.health}</p>
                </div>`;

                result.innerHTML += `<div class="card">
                    <h4>Planets</h4>
                    <ul class="list-group list-group-flush">
                        ${Object.entries(json.graha).map(([planet, info]) => `
                            <li class="list-group-item bg-transparent border-light text-light">
                                <strong>${planet.toUpperCase()}:</strong> ${info.rashi} (${info.degree}°) - ${info.nakshatra}
                            </li>
                        `).join('')}
                    </ul>
                </div>`;

            } catch (err) {
                result.innerHTML = `<div class="text-danger text-center">Error: ${err.message}</div>`;
            } finally {
                loading.style.display = "none";
            }
        });
    </script>
</body>
</html>
