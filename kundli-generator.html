<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Janam Kundli Generator - BookMyPandit</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,#2b0a0a,#0b0202);
  color:#e0d8c3;
}
.container{max-width:1000px;margin:auto;padding:50px 20px;}
h1,h2{font-family:'Playfair Display',serif;color:#ffb347;text-align:center;}
.form-box{
  background:rgba(255,179,71,.12);
  border-radius:22px;
  padding:45px;
  margin:40px auto;
  box-shadow:0 15px 45px rgba(0,0,0,.6);
}
.output{
  display:none;
  margin-top:50px;
  background:rgba(10,10,20,.85);
  border-radius:22px;
  padding:40px;
}
.card{
  background:rgba(255,255,255,.08);
  border:none;
  border-radius:16px;
  padding:22px;
  margin-bottom:25px;
}
.loading{
  text-align:center;
  font-size:1.4rem;
  color:#ffb347;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.kundli-wheel{
  width:260px;
  height:260px;
  border:4px solid #ffb347;
  border-radius:50%;
  margin:30px auto;
  position:relative;
  animation:spin 18s linear infinite;
}
.kundli-wheel::before,
.kundli-wheel::after{
  content:"";
  position:absolute;
  background:#ffb347;
}
.kundli-wheel::before{
  width:2px;height:100%;left:50%;top:0;transform:translateX(-50%);
}
.kundli-wheel::after{
  height:2px;width:100%;top:50%;left:0;transform:translateY(-50%);
}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>

<body>

<div class="container">
  <h1>Janam Kundli Generator</h1>
  <p class="text-center mb-5">Real Vedic Kundli • Powered by Prokerala API</p>

  <!-- FORM -->
  <div class="form-box">
    <h2>Birth Details</h2>
    <form id="kundliForm">
      <div class="row g-4">
        <div class="col-md-4">
          <label>Date of Birth</label>
          <input type="date" id="dob" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label>Time of Birth</label>
          <input type="time" id="tob" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label>Place</label>
          <input type="text" id="place" class="form-control" placeholder="Ahmedabad" required>
        </div>
      </div>
      <button type="submit" class="btn btn-warning w-100 mt-4 py-3 fw-bold">
        Generate Real Kundli
      </button>
    </form>
  </div>

  <!-- OUTPUT -->
  <div class="output" id="output">
    <h2>Your Janam Kundli</h2>

    <div class="kundli-wheel"></div>

    <div class="loading" id="loading">🔮 Generating Kundli...</div>
    <div id="result"></div>
  </div>
</div>

<script>
document.getElementById("kundliForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const output = document.getElementById("output");
  const result = document.getElementById("result");
  const loading = document.getElementById("loading");

  output.style.display = "block";
  loading.style.display = "block";
  result.innerHTML = "";

  const dob = document.getElementById("dob").value;
  const tob = document.getElementById("tob").value;
  const place = document.getElementById("place").value;

  try{
    const res = await fetch(
      `kundli_api.php?dob=${dob}&tob=${tob}&place=${encodeURIComponent(place)}`
    );

    const json = await res.json();
    console.log("KUNDLI JSON:", json);

    if(json.status !== "ok"){
      throw new Error("API returned error");
    }

    const d = json.data;

    const nak = d.nakshatra_details?.nakshatra?.name || "N/A";
    const pada = d.nakshatra_details?.nakshatra?.pada || "N/A";

    const chandra = d.chandra_rasi?.name || "N/A";
    const chandraLord = d.chandra_rasi?.lord?.vedic_name || "N/A";

    const surya = d.soorya_rasi?.name || "N/A";
    const suryaLord = d.soorya_rasi?.lord?.vedic_name || "N/A";

    const zodiac = d.zodiac?.name || "N/A";

    const gana = d.additional_info?.ganam || "N/A";
    const nadi = d.additional_info?.nadi || "N/A";
    const yoni = d.additional_info?.animal_sign || "N/A";
    const stone = d.additional_info?.birth_stone || "N/A";

    result.innerHTML = `
      <div class="card">
        <h4>🌙 Nakshatra</h4>
        <p>${nak} (Pada ${pada})</p>
      </div>

      <div class="card">
        <h4>🌙 Chandra Rashi</h4>
        <p>${chandra}</p>
        <p>Lord: ${chandraLord}</p>
      </div>

      <div class="card">
        <h4>☀️ Surya Rashi</h4>
        <p>${surya}</p>
        <p>Lord: ${suryaLord}</p>
      </div>

      <div class="card">
        <h4>♌ Zodiac</h4>
        <p>${zodiac}</p>
      </div>

      <div class="card">
        <h4>🔮 Additional Info</h4>
        <p>Gana: ${gana}</p>
        <p>Nadi: ${nadi}</p>
        <p>Yoni: ${yoni}</p>
        <p>Birth Stone: ${stone}</p>
      </div>
    `;
  }
  catch(err){
    result.innerHTML =
      `<div class="text-danger text-center mt-4">❌ ${err.message}</div>`;
  }
  finally{
    loading.style.display = "none";
  }
});
</script>

</body>
</html>
