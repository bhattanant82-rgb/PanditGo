<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kundli Generator - PanditGo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
    background: linear-gradient(to bottom,#4B0000,#8B0000);
    color:#f5e8d3;
    font-family:'Poppins',sans-serif;
}
h1,h2,h3,h5{font-family:'Playfair Display',serif;}
.kundli-form{
    background:rgba(255,153,51,0.1);
    border-radius:20px;
    padding:40px;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
}
.kundli-output{
    background:rgba(10,5,0,.85);
    border-radius:20px;
    padding:30px;
    margin-top:40px;
}
.prediction-card{
    background:rgba(255,255,255,0.05);
    border-radius:15px;
    padding:20px;
    height:100%;
}
.btn-generate{
    background:#FF9933;
    border:none;
    border-radius:50px;
    padding:15px 40px;
    font-size:1.2rem;
    font-weight:600;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="vh-100 d-flex align-items-center justify-content-center text-center">
<div class="container">
<h1 class="display-1 fw-bold mb-4">Generate Your<br><span style="color:#FF9933">Janam Kundli</span></h1>
<p class="fs-4">Accurate Vedic Kundli with future predictions</p>
</div>
</section>

<!-- FORM -->
<section class="py-5">
<div class="container">
<div class="kundli-form mx-auto" style="max-width:800px">

<h2 class="text-center mb-4" style="color:#FF9933">Enter Birth Details</h2>

<form id="kundliForm">
<input class="form-control mb-3" id="dob" placeholder="Date of Birth (DD/MM/YYYY)" required>
<input class="form-control mb-3" id="tob" placeholder="Time of Birth (HH:MM:SS)" required>
<input class="form-control mb-4" id="place" placeholder="Place of Birth (City Name)" required>
<div class="text-center">
<button class="btn btn-generate">Generate Kundli</button>
</div>
</form>

<!-- OUTPUT -->
<div id="kundliOutput" class="kundli-output d-none">

<h3 class="text-center mb-4" style="color:#FF9933">Your Janam Kundli</h3>

<div class="row g-4">
<div class="col-md-6">
<h5>Lagna Chart</h5>
<p id="lagnaChart"></p>
</div>

<div class="col-md-6">
<h5>Navamsa Chart</h5>
<p id="navamsaChart"></p>
</div>

<div class="col-12">
<h5>Current Dasha</h5>
<p id="dasha"></p>
</div>
</div>

<hr class="my-4">

<h4 class="text-center mb-4" style="color:#FFD700">Future Predictions</h4>

<div class="row g-4">
<div class="col-md-6">
<div class="prediction-card">
<h5>🎓 Career</h5>
<p id="career"></p>
</div>
</div>

<div class="col-md-6">
<div class="prediction-card">
<h5>💰 Money</h5>
<p id="money"></p>
</div>
</div>

<div class="col-md-6">
<div class="prediction-card">
<h5>❤️ Marriage</h5>
<p id="marriage"></p>
</div>
</div>

<div class="col-md-6">
<div class="prediction-card">
<h5>🏥 Health</h5>
<p id="health"></p>
</div>
</div>
</div>

</div>
</div>
</section>

<script>
document.getElementById("kundliForm").addEventListener("submit",function(e){
e.preventDefault();

document.getElementById("kundliOutput").classList.remove("d-none");

document.getElementById("lagnaChart").innerHTML = `
Lagna: Mesh (Aries)<br>
Sun: Aries 15°<br>
Moon: Taurus 22°<br>
Mars: Gemini 10°
`;

document.getElementById("navamsaChart").innerHTML = `
Navamsa Lagna: Virgo<br>
Venus: Cancer 5°<br>
Mercury: Libra 18°
`;

document.getElementById("dasha").innerHTML = `
Mahadasha: Venus (till 2030)<br>
Antardasha: Sun (till 2026)<br>
Next Dasha: Moon (2030–2040)
`;

document.getElementById("career").innerText =
"Strong chances of success in business, IT, management or leadership roles. Venus dasha supports growth till 2030.";

document.getElementById("money").innerText =
"Stable income with good savings potential. Avoid risky investments during Sun antardasha.";

document.getElementById("marriage").innerText =
"Marriage chances improve after mid-2026. Partner will be supportive but emotional.";

document.getElementById("health").innerText =
"Generally good health. Take care of stress, digestion and head-related issues.";
});
</script>

</body>
</html>
