<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Janam Kundli Generator | PanditGo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,#3a0a0a,#0a0202);
  color:#f6e6c9;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px;
}
.hero h1{
  font-family:'Playfair Display',serif;
  font-size:3.5rem;
  color:#ffb347;
}
.hero p{
  margin-top:15px;
  font-size:1.1rem;
  opacity:.9;
}

/* FORM */
.form-box{
  max-width:800px;
  margin:50px auto;
  background:rgba(255,255,255,.06);
  border-radius:20px;
  padding:40px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  backdrop-filter:blur(12px);
}
.form-box h2{
  text-align:center;
  color:#ffb347;
  margin-bottom:30px;
}
.form-box input{
  width:100%;
  padding:15px;
  margin-bottom:20px;
  border-radius:10px;
  border:none;
  font-size:1rem;
}
.form-box button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:50px;
  background:linear-gradient(135deg,#ff9933,#ffcc66);
  font-size:1.2rem;
  font-weight:600;
  cursor:pointer;
}
.form-box button:hover{opacity:.9}

/* OUTPUT */
.output{
  display:none;
  max-width:1000px;
  margin:60px auto;
  padding:40px;
  background:rgba(0,0,0,.85);
  border-radius:20px;
}
.section-title{
  text-align:center;
  font-family:'Playfair Display',serif;
  color:#ffcc66;
  margin-bottom:30px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}
.card{
  background:rgba(255,255,255,.05);
  padding:20px;
  border-radius:15px;
  transition:.4s;
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 10px 30px rgba(255,204,102,.3);
}
.card h4{color:#ffb347;margin-bottom:10px}
.loading{text-align:center;font-size:1.2rem;color:#ffb347}
</style>
</head>

<body>

<section class="hero">
  <div>
    <h1>Janam Kundli Generator</h1>
    <p>Real Vedic Kundli • Swiss Ephemeris • Trusted Astrology</p>
  </div>
</section>

<div class="form-box">
  <h2>Enter Birth Details</h2>
  <form id="kundliForm">
    <input type="date" id="dob" required>
    <input type="time" id="tob" required>
    <input type="text" id="place" placeholder="Place of Birth (City)" required>
    <button>Generate Real Kundli</button>
  </form>
</div>

<div class="output" id="output">
  <h2 class="section-title">Your Janam Kundli</h2>
  <div id="result" class="grid"></div>
</div>

<script>
document.getElementById("kundliForm").addEventListener("submit",async function(e){
  e.preventDefault();
  document.getElementById("output").style.display="block";
  document.getElementById("result").innerHTML =
    `<div class="loading">🔮 Calculating planetary positions...</div>`;

  const dob = dob.value;
  const tob = tob.value;
  const place = place.value;

  const res = await fetch(
    `kundli_api.php?dob=${dob}&tob=${tob}&place=${place}`
  );
  const data = await res.json();

  let html="";
  data.data.planets.forEach(p=>{
    html+=`
      <div class="card">
        <h4>${p.name}</h4>
        <p>${p.sign} • ${p.degree}°</p>
      </div>
    `;
  });

  document.getElementById("result").innerHTML = html;
});
</script>

</body>
</html>
