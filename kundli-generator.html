<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Janam Kundli Generator - BookMyPandit</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    body {font-family:'Poppins',sans-serif;background:#0f0f1a;color:#e0d8c3;}
    .container{max-width:900px;margin:auto;padding:40px 20px;}
    h1,h2{color:#ff9933;text-align:center;}
    .form-box{background:rgba(255,153,51,0.1);border-radius:20px;padding:40px;margin:30px auto;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
    .output{display:none;margin-top:40px;background:rgba(20,20,40,0.8);border-radius:20px;padding:30px;}
    .card{background:rgba(255,255,255,0.08);border:none;border-radius:15px;padding:20px;margin-bottom:20px;}
    .loading{text-align:center;font-size:1.4rem;color:#ff9933;animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
</style>
</head>
<body>

<div class="container">
    <h1>Janam Kundli Generator</h1>
    <p class="text-center mb-5">Real Vedic Kundli • Powered by Astrology</p>

    <div class="form-box">
        <h2>Birth Details</h2>
        <form id="kundliForm">
            <div class="row g-4">
                <div class="col-md-4">
                    <label>Date of Birth</label>
                    <input type="date" id="dob" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label>Time of Birth</label>
                    <input type="time" id="tob" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label>Place (lat,long)</label>
                    <input type="text" id="place" class="form-control" placeholder="23.0225,72.5714" required>
                </div>
            </div>
            <button type="submit" class="btn btn-warning w-100 mt-4 py-3 fw-bold">Generate Kundli</button>
        </form>
    </div>

    <div class="output" id="output">
        <h2>Your Janam Kundli</h2>
        <div class="loading" id="loading">🔮 Generating Kundli...</div>
        <div id="result"></div>
    </div>
</div>

<script>
document.getElementById("kundliForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const output = document.getElementById("output");
    const result = document.getElementById("result");
    const loading = document.getElementById("loading");

    output.style.display = "block";
    loading.style.display = "block";
    result.innerHTML = "";

    const dob = document.getElementById("dob").value;
    const dobFormatted = dob.split('-').reverse().join('/'); // YYYY-MM-DD → DD/MM/YYYY

    const tob = document.getElementById("tob").value;
    const place = document.getElementById("place").value.trim();

    try {
        const res = await fetch("http://127.0.0.1:5000/generate-kundli", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({dob: dobFormatted, tob, place})
        });

        if (!res.ok) throw new Error("Backend error: " + res.status);

        const data = await res.json();

        if (data.error) throw new Error(data.error);

        const lagna = data.lagna || {};
        const graha = data.graha || {};
        const dasha = data.current_dasha || {};
        const pred = data.predictions || {};

        result.innerHTML = `
            <div class="card">
                <h4>Lagna</h4>
                <p>${lagna.rashi || 'N/A'} (${lagna.degree || 'N/A'}°)</p>
                <p>Nakshatra: ${lagna.nakshatra || 'N/A'}</p>
            </div>

            <div class="card">
                <h4>Current Dasha</h4>
                <p>${dasha.lord || 'N/A'}</p>
                <p>${dasha.effect || 'N/A'}</p>
            </div>

            <div class="card">
                <h4>Predictions</h4>
                <p><b>Career:</b> ${pred.career || 'N/A'}</p>
                <p><b>Money:</b> ${pred.money || 'N/A'}</p>
                <p><b>Marriage:</b> ${pred.marriage || 'N/A'}</p>
                <p><b>Health:</b> ${pred.health || 'N/A'}</p>
            </div>

            <div class="card mt-4">
                <h4>Planets</h4>
                <ul class="list-group list-group-flush">
                    ${Object.entries(graha).map(([p, v]) => `
                        <li class="list-group-item bg-transparent border-light text-light">
                            <b>${p.toUpperCase()}:</b> ${v.rashi} (${v.degree}°)
                        </li>
                    `).join('')}
                </ul>
            </div>
        `;
    } catch (err) {
        result.innerHTML = `<div class="text-danger text-center">Error: ${err.message}</div>`;
    } finally {
        loading.style.display = "none";
    }
});
</script>
</body>
</html>
