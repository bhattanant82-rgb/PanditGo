<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanditGo Kundli Generator</title>
    <style>
        :root {
            --gold: #d4af37;
            --deep-maroon: #5d1010;
            --spiritual-orange: #ff9933;
            --cream: #fffdf5;
            --shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #4a0e0e);
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--cream);
            width: 90%;
            max-width: 1000px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 5px solid var(--gold);
            display: flex;
            flex-wrap: wrap;
        }

        /* Sidebar Section */
        .input-section {
            flex: 1;
            padding: 40px;
            background: white;
            border-right: 2px solid #eee;
        }

        .input-section h2 {
            color: var(--deep-maroon);
            border-bottom: 2px solid var(--spiritual-orange);
            padding-bottom: 10px;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--spiritual-orange);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
        }

        button:hover { background: #e67e22; transform: translateY(-2px); }

        /* Kundli Chart Section */
        .display-section {
            flex: 1.2;
            padding: 40px;
            background: #fff;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Spiritual Chart Design (Diamond Chart) */
        .kundli-chart {
            position: relative;
            width: 350px;
            height: 350px;
            border: 3px solid var(--deep-maroon);
            background: #fff;
            margin: 20px auto;
        }

        .line { position: absolute; background: var(--deep-maroon); }
        .diag1 { width: 495px; height: 2px; top: 173px; left: -72px; transform: rotate(45deg); }
        .diag2 { width: 495px; height: 2px; top: 173px; left: -72px; transform: rotate(-45deg); }
        .square {
            position: absolute;
            width: 247px;
            height: 247px;
            border: 2px solid var(--deep-maroon);
            top: 50px;
            left: 50px;
            transform: rotate(45deg);
        }

        /* House Numbers */
        .house {
            position: absolute;
            font-size: 14px;
            font-weight: bold;
            color: #888;
        }

        /* Planets in Chart */
        .planet-data {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
            color: var(--deep-maroon);
            width: 60px;
            text-align: center;
        }

        .h1 { top: 140px; left: 145px; } /* Center House */
        .h2 { top: 60px; left: 60px; }
        .h4 { top: 140px; left: 40px; }

        #prediction-text {
            margin-top: 20px;
            font-style: italic;
            color: #444;
            line-height: 1.6;
            background: #fff4e6;
            padding: 15px;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .input-section { border-right: none; border-bottom: 1px solid #eee; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="input-section">
        <h2>✨ Janam Kundli</h2>
        <p>Premium Spiritual Birth Chart</p>
        
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="userName" placeholder="Enter name">
        </div>
        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="dob">
        </div>
        <div class="form-group">
            <label>Time of Birth</label>
            <input type="time" id="tob">
        </div>
        <div class="form-group">
            <label>Gender</label>
            <select id="gender">
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>
        <button onclick="generateKundli()">Generate My Kundli</button>
    </div>

    <div class="display-section" id="kundliOutput">
        <h3 id="chartTitle">Your Spiritual Blueprint</h3>
        
        <div class="kundli-chart">
            <div class="line diag1"></div>
            <div class="line diag2"></div>
            <div class="square"></div>
            
            <div class="house" style="top:110px; left:168px">1</div>
            <div class="house" style="top:40px; left:80px">2</div>
            <div class="house" style="top:40px; left:250px">12</div>
            <div class="house" style="top:165px; left:290px">10</div>
            
            <div id="p1" class="planet-data" style="top:150px; left:145px">Sun, Mer</div>
            <div id="p2" class="planet-data" style="top:80px; left:60px">Jup</div>
            <div id="p3" class="planet-data" style="top:150px; left:50px">Mar</div>
            <div id="p4" class="planet-data" style="top:250px; left:145px">Sat</div>
        </div>

        <div id="prediction-text">
            Enter your details to reveal your career, love, and health insights based on Vedic Dashas.
        </div>
    </div>
</div>

<script>
    function generateKundli() {
        const name = document.getElementById('userName').value;
        const dob = document.getElementById('dob').value;

        if(!name || !dob) {
            alert("Please enter Name and Date of Birth");
            return;
        }

        // Simulating Vedic Calculations for UI representation
        document.getElementById('chartTitle').innerText = `${name}'s Lagna Chart`;
        
        // Randomizing planets for demo purposes (In real apps, use an API/Ephemeris)
        const planets = ["Sun", "Moon", "Mars", "Mercury", "Jupiter", "Venus", "Saturn", "Rahu", "Ketu"];
        document.getElementById('p1').innerText = planets[Math.floor(Math.random() * 3)];
        document.getElementById('p2').innerText = planets[Math.floor(Math.random() * 3) + 3];
        document.getElementById('p3').innerText = planets[Math.floor(Math.random() * 3) + 6];

        // Dynamic Prediction based on input
        const predictions = [
            "Your 10th House (Career) is strong. A leadership role or business is highly favorable for you.",
            "Venus is in a beneficial position. Your personal relationships and marriage will bring harmony and luxury.",
            "Saturn suggests you will gain wealth through discipline and hard work after the age of 28.",
            "Jupiter's aspect on your 1st house indicates a spiritual and wise personality."
        ];
        
        document.getElementById('prediction-text').innerHTML = `
            <strong>Spiritual Insight:</strong><br>
            ${predictions[Math.floor(Math.random() * predictions.length)]}
            <br><br>
            <em>*Consult an expert for detailed Dasha analysis.</em>
        `;

        // Smooth scroll to results on mobile
        if(window.innerWidth < 768) {
            document.getElementById('kundliOutput').scrollIntoView({ behavior: 'smooth' });
        }
    }
</script>

</body>
</html>
