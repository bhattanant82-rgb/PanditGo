<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanditGo - Kundli Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Add your other stylesheets here -->
</head>
<body>
    <div class="container mt-5">
        <h2>Generate Real Janam Kundli</h2>
        <form id="kundliForm">
            <div class="mb-3">
                <label for="dob" class="form-label">Date of Birth (YYYY-MM-DD)</label>
                <input type="date" class="form-control" id="dob" required>
            </div>
            <div class="mb-3">
                <label for="time" class="form-label">Exact Time of Birth (HH:MM, 24-hour)</label>
                <input type="time" class="form-control" id="time" required>
            </div>
            <div class="mb-3">
                <label for="place" class="form-label">Place of Birth (City, Country)</label>
                <input type="text" class="form-control" id="place" placeholder="e.g., Delhi, India" required>
            </div>
            <button type="submit" class="btn btn-primary">Generate Kundli</button>
        </form>
        <div id="result" class="mt-4"></div>
        <svg id="chart" width="600" height="400"></svg> <!-- Chart container -->
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/snap.svg/0.5.1/snap.svg.min.js"></script>
    <script src="astrochart.js"></script> <!-- Your downloaded file -->
    <script type="module">
        import SwissEph from 'https://cdn.jsdelivr.net/npm/swisseph-wasm@latest/dist/swisseph.js';

        const form = document.getElementById('kundliForm');
        const resultDiv = document.getElementById('result');
        const swe = new SwissEph();

        // Planet mappings (Vedic abbreviations for chart)
        const planetNames = {
            0: 'Su',  // Sun
            1: 'Mo',  // Moon
            2: 'Me',  // Mercury
            3: 'Ve',  // Venus
            4: 'Ma',  // Mars
            5: 'Ju',  // Jupiter
            6: 'Sa',  // Saturn
            10: 'Ra', // Rahu (Mean Node)
            // Ketu is opposite Rahu, calculated separately
        };

        // Rashi names
        const rashiNames = ['Aries', 'Taurus', 'Gemini', 'Cancer', 'Leo', 'Virgo', 'Libra', 'Scorpio', 'Sagittarius', 'Capricorn', 'Aquarius', 'Pisces'];

        // Nakshatra names (27)
        const nakshatraNames = ['Ashwini', 'Bharani', 'Krittika', 'Rohini', 'Mrigashira', 'Ardra', 'Punarvasu', 'Pushya', 'Ashlesha', 'Magha', 'Purva Phalguni', 'Uttara Phalguni', 'Hasta', 'Chitra', 'Swati', 'Vishakha', 'Anuradha', 'Jyeshtha', 'Mula', 'Purva Ashadha', 'Uttara Ashadha', 'Shravana', 'Dhanishta', 'Shatabhisha', 'Purva Bhadrapada', 'Uttara Bhadrapada', 'Revati'];

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            resultDiv.innerHTML = 'Calculating...';

            const dob = document.getElementById('dob').value;
            const time = document.getElementById('time').value;
            const place = document.getElementById('place').value;

            // Step 1: Geocode place to lat/long
            let lat, lon;
            try {
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(place)}&format=json&limit=1`);
                const geoData = await geoRes.json();
                if (geoData.length === 0) throw new Error('Place not found');
                lat = parseFloat(geoData[0].lat);
                lon = parseFloat(geoData[0].lon);
            } catch (err) {
                resultDiv.innerHTML = `<p class="text-danger">Error: ${err.message}</p>`;
                return;
            }

            // Step 2: Parse birth date/time to UTC Julian Day
            const [year, month, day] = dob.split('-').map(Number);
            const [hour, minute] = time.split(':').map(Number);
            const birthDate = new Date(Date.UTC(year, month - 1, day, hour, minute));
            await swe.initSwissEph();
            const jd = swe.utc_to_jd(year, month, day, hour, minute, 0, 1)[1]; // Gregorian, UTC

            // Step 3: Set sidereal mode (Lahiri ayanamsa for Vedic)
            swe.set_sid_mode(SwissEph.SE_SIDM_LAHIRI, 0, 0);

            // Step 4: Calculate house cusps and Ascendant (Porphyry system for Bhava)
            const houseData = swe.houses_ex(jd, lat, lon, 'P', SwissEph.SEFLG_SIDEREAL); // 'P' = Porphyry
            const houseCusps = houseData.house; // Array of 12 cusp longitudes
            const asc = houseData.ascendant;

            // Step 5: Calculate planetary positions (sidereal)
            const flags = SwissEph.SEFLG_SWIEPH | SwissEph.SEFLG_SIDEREAL;
            const planets = {};
            const planetIds = [SwissEph.SE_SUN, SwissEph.SE_MOON, SwissEph.SE_MERCURY, SwissEph.SE_VENUS, SwissEph.SE_MARS, SwissEph.SE_JUPITER, SwissEph.SE_SATURN, SwissEph.SE_MEAN_NODE]; // Rahu
            for (const id of planetIds) {
                const pos = swe.calc_ut(jd, id, flags);
                planets[id] = pos[0]; // Longitude in degrees
            }
            // Ketu is Rahu + 180° mod 360
            planets['ketu'] = (planets[SwissEph.SE_MEAN_NODE] + 180) % 360;

            // Step 6: Determine Rashi and House for each planet
            let output = '<h4>Kundli Details</h4><ul>';
            const chartData = Array.from({length: 12}, () => []); // Houses 0-11 for 1-12
            Object.entries(planetNames).forEach(([id, name]) => {
                const long = id === 'ketu' ? planets['ketu'] : planets[parseInt(id)];
                const rashiIndex = Math.floor(long / 30);
                const rashi = rashiNames[rashiIndex];
                const degreeInRashi = long % 30;

                // Find house (Bhava)
                let house = 1;
                for (let i = 0; i < 12; i++) {
                    const start = houseCusps[i];
                    const end = houseCusps[(i + 1) % 12];
                    if (start < end ? (long >= start && long < end) : (long >= start || long < end)) {
                        house = i + 1;
                        break;
                    }
                }
                chartData[house - 1].push(name);
                output += `<li>${name}: ${degreeInRashi.toFixed(2)}° in ${rashi} (House ${house})</li>`;
            });
            // Ascendant
            chartData[0].push('Asc'); // Assuming house 1 for Lagna if asc is in it; adjust if needed

            // Step 7: Moon Nakshatra
            const moonLong = planets[SwissEph.SE_MOON];
            const nakshatraIndex = Math.floor(moonLong / (360 / 27));
            const nakshatra = nakshatraNames[nakshatraIndex];
            output += `<li>Moon Nakshatra: ${nakshatra}</li></ul>`;

            resultDiv.innerHTML = output;

            // Step 8: Draw Chart
            const astroChart = new AstroChart("#chart");
            astroChart.draw(chartData.reduce((acc, planets, i) => { acc[i + 1] = planets; return acc; }, {}), {
                title: ['Janam Kundli', `${dob} ${time}`, place],
                width: 600,
                height: 400,
                showHouseNumbers: true
            });

            swe.close();
        });
    </script>
</body>
</html>
