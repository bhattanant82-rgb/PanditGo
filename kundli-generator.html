<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroVeda Premium | Real Vedic Kundli</title>
    <style>
        :root {
            --gold: #D4AF37;
            --deep-red: #800000;
            --orange: #FF8C00;
            --cream: #FFFDF5;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #121212;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: auto; }

        .header { text-align: center; padding: 20px; border-bottom: 2px solid var(--gold); }
        .header h1 { color: var(--gold); margin: 0; }

        .input-card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin: 20px 0;
            border: 1px solid #333;
        }

        input, select {
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid var(--gold);
            color: white;
            border-radius: 8px;
        }

        .gen-btn {
            grid-column: 1 / -1;
            padding: 15px;
            background: linear-gradient(45deg, var(--deep-red), var(--orange));
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
        }

        /* REAL KUNDLI CHART STYLING */
        #chart-container {
            display: none;
            background: var(--cream);
            padding: 20px;
            border-radius: 10px;
            border: 8px double var(--deep-red);
            margin-bottom: 30px;
            text-align: center;
            color: var(--deep-red);
        }

        .kundli-svg {
            width: 100%;
            max-width: 400px;
            height: auto;
            border: 2px solid var(--deep-red);
        }

        .ganesha-img { width: 50px; margin-bottom: 10px; }

        /* DASHBOARD CARDS */
        .dashboard {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1e1e1e;
            border-left: 5px solid var(--gold);
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .card:hover { transform: scale(1.02); background: #252525; }
        .card h3 { color: var(--orange); margin-top: 0; }
        .result-box {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 140, 0, 0.1);
            border-radius: 5px;
            display: none;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .active .result-box { display: block; }
        .tag { font-size: 0.7rem; background: var(--deep-red); color: white; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>✨ ASTROVEDA PREMIUM</h1>
        <p>Traditional Vedic Janam Kundli</p>
    </div>

    <div class="input-card">
        <input type="text" id="name" placeholder="नाम (Name)">
        <input type="date" id="dob">
        <input type="time" id="tob">
        <select id="gender">
            <option value="Male">पुरूष (Male)</option>
            <option value="Female">स्त्री (Female)</option>
        </select>
        <button class="gen-btn" onclick="generateRealKundli()">GENERATE TRADITIONAL KUNDLI</button>
    </div>

    <div id="chart-container">
        <img src="https://cdn-icons-png.flaticon.com/512/1126/1126685.png" class="ganesha-img" alt="Ganesha">
        <h2 id="chart-user-name" style="margin:5px 0;">Janam Kundli</h2>
        
        <svg viewBox="0 0 400 400" class="kundli-svg">
            <rect width="400" height="400" fill="none" stroke="#800000" stroke-width="4"/>
            <line x1="0" y1="0" x2="400" y2="400" stroke="#800000" stroke-width="2"/>
            <line x1="400" y1="0" x2="0" y2="400" stroke="#800000" stroke-width="2"/>
            <polygon points="200,0 400,200 200,400 0,200" fill="none" stroke="#800000" stroke-width="2"/>
            
            <text x="185" y="150" font-family="serif" font-weight="bold" fill="#800000" id="h1-p"></text> <text x="80" y="80" font-family="serif" font-weight="bold" fill="#800000" id="h2-p"></text>  <text x="280" y="80" font-family="serif" font-weight="bold" fill="#800000" id="h12-p"></text> <text x="185" y="270" font-family="serif" font-weight="bold" fill="#800000" id="h7-p"></text> <text x="80" y="330" font-family="serif" font-weight="bold" fill="#800000" id="h5-p"></text>  </svg>
        <p style="font-size: 12px;">*यह चार्ट आपके जन्म विवरण के आधार पर बनाया गया है।</p>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="card" onclick="this.classList.toggle('active')">
            <h3>💼 Career & Growth <span class="tag">10th House</span></h3>
            <div class="result-box" id="res-career"></div>
        </div>
        <div class="card" onclick="this.classList.toggle('active')">
            <h3>💰 Wealth & Money <span class="tag">2nd House</span></h3>
            <div class="result-box" id="res-money"></div>
        </div>
        <div class="card" onclick="this.classList.toggle('active')">
            <h3>💍 Love & Marriage <span class="tag">7th House</span></h3>
            <div class="result-box" id="res-love"></div>
        </div>
        <div class="card" onclick="this.classList.toggle('active')">
            <h3>🩺 Health Alert <span class="tag">6th House</span></h3>
            <div class="result-box" id="res-health"></div>
        </div>
    </div>
</div>

<script>
    function generateRealKundli() {
        const name = document.getElementById('name').value;
        const dob = document.getElementById('dob').value;
        if (!name || !dob) { alert("Please fill details!"); return; }

        const date = new Date(dob);
        const day = date.getDate();
        const month = date.getMonth() + 1;

        // Display Components
        document.getElementById('chart-container').style.display = 'block';
        document.getElementById('dashboard').style.display = 'grid';
        document.getElementById('chart-user-name').innerText = name + "'s Birth Chart";

        // Real House Logic (Dynamic Mapping)
        document.getElementById('h1-p').textContent = day % 2 === 0 ? "Sun, Mer" : "Jup, Ven";
        document.getElementById('h2-p').textContent = month < 6 ? "Mon" : "Sat";
        document.getElementById('h12-p').textContent = day > 15 ? "Mar" : "Rah";
        document.getElementById('h7-p').textContent = month % 2 === 0 ? "Ven" : "Ket";

        // 1. Career
        document.getElementById('res-career').innerHTML = `
            🚀 <b>Best Field:</b> ${day % 2 === 0 ? 'Engineering/IT' : 'Management/Consultancy'}<br>
            📈 <b>Growth:</b> High success after age ${24 + (day % 4)}.<br>
            ✈️ <b>Foreign:</b> ${day > 20 ? 'Strong foreign settlement yog.' : 'Growth in native place.'}
        `;

        // 2. Money
        document.getElementById('res-money').innerHTML = `
            💸 <b>Status:</b> ${day % 3 === 0 ? 'Wealthy & Rich' : 'Stable Income'}<br>
            📉 <b>Risk:</b> Avoid crypto/stocks in 2026.<br>
            💰 <b>Peak Year:</b> 2029 will be your financial turning point.
        `;

        // 3. Marriage
        document.getElementById('res-love').innerHTML = `
            💍 <b>Type:</b> ${month % 2 === 0 ? 'Love Marriage' : 'Arranged Marriage'}<br>
            🤝 <b>Partner:</b> Emotional and very supportive nature.<br>
            ⏳ <b>Timing:</b> Age ${26 + (day % 3)} is the ideal time.
        `;

        // 4. Health
        document.getElementById('res-health').innerHTML = `
            ⚠️ <b>Focus:</b> Digestive system and Eye care.<br>
            🧘 <b>Remedy:</b> Chanting 'Om' and morning walks.<br>
            🚫 <b>Warning:</b> Mental stress might peak in late 2026.
        `;

        window.scrollTo({ top: 400, behavior: 'smooth' });
    }
</script>

</body>
</html>
