<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Janam Kundli Generator | PanditGo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- ICONS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ================= GLOBAL ================= */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,#3b0a0a,#090101);
  color:#f5e6c8;
  overflow-x:hidden;
}
h1,h2,h3{font-family:'Playfair Display',serif}

/* ================= HERO ================= */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:url("https://images.unsplash.com/photo-1549640376-6a1e9c84dcd6?auto=format&fit=crop&w=1400&q=80") center/cover;
  opacity:.12;
}
.hero-content{position:relative;z-index:2}
.hero h1{
  font-size:4rem;
  color:#ffcc66;
  letter-spacing:1px;
}
.hero p{
  margin-top:15px;
  opacity:.85;
  font-size:1.1rem;
}

/* ================= FORM ================= */
.form-section{
  padding:80px 20px;
  display:flex;
  justify-content:center;
}
.form-box{
  width:100%;
  max-width:900px;
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(15px);
  border-radius:25px;
  padding:50px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}
.form-box h2{
  text-align:center;
  color:#ffcc66;
  margin-bottom:40px;
}
.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}
.form-box input{
  padding:16px;
  border-radius:12px;
  border:none;
  font-size:1rem;
}
.form-box button{
  margin-top:30px;
  width:100%;
  padding:18px;
  border:none;
  border-radius:50px;
  background:linear-gradient(135deg,#ff9933,#ffd27f);
  font-size:1.2rem;
  font-weight:600;
  cursor:pointer;
}
.form-box button:hover{opacity:.9}

/* ================= OUTPUT ================= */
.output{
  display:none;
  padding:80px 20px;
}
.section-title{
  text-align:center;
  color:#ffcc66;
  margin-bottom:50px;
}
.grid{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
}
.card{
  background:rgba(255,255,255,.06);
  border-radius:20px;
  padding:25px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.6);
  transition:.4s;
}
.card:hover{
  transform:translateY(-8px);
  box-shadow:0 20px 60px rgba(255,204,102,.35);
}
.card i{
  font-size:2rem;
  color:#ffcc66;
  margin-bottom:15px;
}
.loading{
  text-align:center;
  font-size:1.3rem;
  color:#ffcc66;
}

/* ================= SVG KUNDLI ================= */
.kundli-wheel{
  max-width:400px;
  margin:60px auto;
  animation:spin 20s linear infinite;
}
@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>Janam Kundli</h1>
    <p>Real Vedic Astrology • Swiss Ephemeris • Trusted Predictions</p>
  </div>
</section>

<!-- FORM -->
<section class="form-section">
  <div class="form-box">
    <h2>Enter Birth Details</h2>
    <form id="kundliForm">
      <div class="form-grid">
        <input type="date" id="dob" required>
        <input type="time" id="tob" required>
        <input type="text" id="place" placeholder="Place of Birth (City)" required>
      </div>
      <button type="submit">Generate Real Kundli</button>
    </form>
  </div>
</section>

<!-- OUTPUT -->
<section class="output" id="output">
  <h2 class="section-title">Your Janam Kundli</h2>

  <!-- SVG KUNDLI -->
  <div class="kundli-wheel">
    <svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="95" stroke="#ffcc66" stroke-width="2" fill="none"/>
      <line x1="100" y1="5" x2="100" y2="195" stroke="#ffcc66"/>
      <line x1="5" y1="100" x2="195" y2="100" stroke="#ffcc66"/>
    </svg>
  </div>

  <div class="grid" id="result">
    <div class="loading">🔮 Calculating planetary positions…</div>
  </div>
</section>

<script>
document.getElementById("kundliForm").addEventListener("submit", async function(e){
  e.preventDefault();

  document.getElementById("output").style.display="block";
  document.getElementById("result").innerHTML =
    `<div class="loading">🔮 Fetching REAL Kundli Data…</div>`;

  const dob = document.getElementById("dob").value;
  const tob = document.getElementById("tob").value;
  const place = document.getElementById("place").value;

  const res = await fetch(
    `kundli_api.php?dob=${dob}&tob=${tob}&place=${place}`
  );
  const data = await res.json();

  let html="";
  data.data.planets.forEach(p=>{
    html+=`
      <div class="card">
        <i class="fa-solid fa-star"></i>
        <h3>${p.name}</h3>
        <p>${p.sign}</p>
        <p>${p.degree}°</p>
      </div>
    `;
  });

  document.getElementById("result").innerHTML = html;
});
</script>

</body>
</html>
