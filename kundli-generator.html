<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>AstroVeda Pro | Semi-Real Kundli Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
 --gold:#D4AF37;--deep-red:#800000;--orange:#FF8C00;
 --bg:#0F0F0F;--card:#1A1A1A;--cream:#FFFDF5;
 --weak:#FF4B4B;--strong:#4CAF50;
}
body{background:var(--bg);color:#eee;font-family:Outfit;margin:0;padding:20px}
.container{max-width:1100px;margin:auto}
.header{text-align:center;border-bottom:2px solid var(--gold);padding:25px}
.header h1{color:var(--gold)}

.input-panel{
background:var(--card);padding:20px;border-radius:12px;
display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px
}
input,select{padding:12px;background:#222;color:white;border:1px solid var(--gold);border-radius:8px}

.gen-btn{
grid-column:1/-1;padding:15px;
background:linear-gradient(45deg,var(--deep-red),var(--orange));
border:none;color:white;font-weight:bold;cursor:pointer;border-radius:8px
}

.section-title{display:none;text-align:center;color:var(--gold);margin:40px 0}

.dashboard,.grah-grid{display:none;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}

.card,.grah-card{
background:var(--card);padding:20px;border-radius:12px;
border-left:5px solid var(--gold);cursor:pointer
}
.card:hover,.grah-card:hover{background:#222}

.card-strong{border-left-color:var(--strong)}
.card-weak{border-left-color:var(--weak)}

.result-box,.solution-box{display:none;margin-top:10px}
.active .result-box,.active .solution-box{display:block}

.status-badge{
float:right;font-size:0.8rem;font-weight:bold;padding:3px 8px;border-radius:4px
}
.status-strong{color:var(--strong)}
.status-weak{color:var(--weak)}
</style>
</head>

<body>
<div class="container">

<div class="header">
<h1>✨ ASTROVEDA PRO</h1>
<p>Semi-Real Kundli • Rashi + Lagna Logic</p>
</div>

<div class="input-panel">
<input id="name" placeholder="Full Name">
<input type="date" id="dob">
<input type="time" id="tob">
<select id="gender"><option>Male</option><option>Female</option></select>
<button class="gen-btn" onclick="generate()">GENERATE REPORT</button>
</div>

<h2 class="section-title">📌 Life Predictions</h2>
<div class="dashboard" id="dashboard">
<div class="card" onclick="this.classList.toggle('active')">
<h3>💼 Career</h3><div class="result-box" id="career"></div>
</div>
<div class="card" onclick="this.classList.toggle('active')">
<h3>💰 Wealth</h3><div class="result-box" id="money"></div>
</div>
<div class="card" onclick="this.classList.toggle('active')">
<h3>💍 Marriage</h3><div class="result-box" id="love"></div>
</div>
</div>

<h2 class="section-title">🪐 Navgraha Analysis</h2>
<div class="grah-grid" id="grah"></div>

</div>

<script>
const rashis=[
"Aries","Taurus","Gemini","Cancer","Leo","Virgo",
"Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"
];

const grahMap=[
{name:"Surya",good:["Leo","Aries"],bad:["Libra"]},
{name:"Chandra",good:["Cancer","Taurus"],bad:["Scorpio"]},
{name:"Mangal",good:["Aries","Scorpio"],bad:["Cancer"]},
{name:"Budh",good:["Gemini","Virgo"],bad:["Pisces"]},
{name:"Guru",good:["Sagittarius","Pisces"],bad:["Gemini"]},
{name:"Shukra",good:["Taurus","Libra"],bad:["Virgo"]},
{name:"Shani",good:["Capricorn","Aquarius"],bad:["Cancer"]},
{name:"Rahu",good:["Aquarius","Gemini"],bad:["Cancer"]},
{name:"Ketu",good:["Scorpio","Pisces"],bad:["Taurus"]}
];

function getRashi(d){
const days=[31,28,31,30,31,30,31,31,30,31,30,31];
let sum=0;
for(let i=0;i<d.getMonth();i++)sum+=days[i];
sum+=d.getDate();
return rashis[sum%12];
}

function getLagna(h){
return rashis[Math.floor(h/2)%12];
}

function generate(){
const name=document.getElementById("name").value;
const dob=document.getElementById("dob").value;
const tob=document.getElementById("tob").value;

if(!name||!dob||!tob){alert("Details bharo");return;}

const d=new Date(dob+"T"+tob);
const rashi=getRashi(d);
const lagna=getLagna(d.getHours());

document.querySelectorAll(".section-title").forEach(x=>x.style.display="block");
document.getElementById("dashboard").style.display="grid";
document.getElementById("grah").style.display="grid";

document.getElementById("career").innerHTML=
`Rashi: <b>${rashi}</b><br>Lagna: <b>${lagna}</b><br>Best fields: IT, Management, Self-Business`;

document.getElementById("money").innerHTML=
`Stable income after age ${24+d.getMonth()%5}. Avoid risky loans before 2027.`;

document.getElementById("love").innerHTML=
lagna==="Libra"||rashi==="Taurus"?
"Strong love marriage yog after 25.":
"Family involvement in marriage likely.";

let html="";
grahMap.forEach(g=>{
let strong=g.good.includes(rashi);
html+=`
<div class="grah-card ${strong?"card-strong":"card-weak"}"
onclick="this.classList.toggle('active')">
<span class="status-badge ${strong?"status-strong":"status-weak"}">
${strong?"STRONG":"WEAK"}
</span>
<h3>${g.name}</h3>
<div class="solution-box">
${strong?
"Positive results, growth, confidence.":
"Delay, mental pressure, discipline required."}
</div>
</div>`;
});

document.getElementById("grah").innerHTML=html;
}
</script>
</body>
</html>
