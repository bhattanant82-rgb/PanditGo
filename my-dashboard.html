<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - BookMyPandit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #111; color: #eee; }
        .container { max-width: 1200px; margin: auto; padding: 40px; }
        .welcome { color: #ff9933; }
        .card { background: #222; border: none; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .status-pending { background: #ff9933; color: black; }
        .status-confirmed { background: #28a745; color: white; }
        .status-cancelled { background: #dc3545; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="welcome mb-4">Welcome Back, Anant! 🙏</h1>

    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <h3>Upcoming Bookings</h3>
                <div class="booking-item mt-3">
                    <p><strong>Booking ID:</strong> #BK12345</p>
                    <p><strong>Puja:</strong> Griha Pravesh</p>
                    <p><strong>Pandit:</strong> Pt. Ram Sharma</p>
                    <p><strong>Date/Time:</strong> 10 Jan 2026, 10:00 AM</p>
                    <p><strong>Status:</strong> <span class="badge status-confirmed">Confirmed</span></p>
                    <button class="btn btn-sm btn-outline-warning mt-2">View Details</button>
                    <button class="btn btn-sm btn-outline-danger mt-2">Request Refund</button>
                </div>
            </div>

            <div class="card mt-4">
                <h3>My Profile</h3>
                <p><strong>Name:</strong> Anant Bhatt</p>
                <p><strong>Email:</strong> bhattanant82@gmail.com</p>
                <p><strong>Phone:</strong> +91 98765 43210</p>
                <p><strong>Address:</strong> Ahmedabad, Gujarat</p>
                <button class="btn btn-sm btn-outline-warning mt-2">Edit Profile</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <h3>Quick Actions</h3>
                <button class="btn btn-warning w-100 mb-3">Book New Puja</button>
                <button class="btn btn-outline-light w-100 mb-3">Generate Kundli</button>
                <button class="btn btn-outline-light w-100 mb-3">Contact Support</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
