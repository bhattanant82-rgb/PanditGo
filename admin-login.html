<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login - BookMyPandit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f2eb; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .admin-login { max-width: 400px; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="admin-login">
        <h2 class="text-center text-danger mb-4">🔥 Admin Only Login</h2>
        <form id="adminLogin">
            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control" id="adminEmail" value="admin@bookmypandit.com" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" class="form-control" id="adminPassword" value="admin123" required>
            </div>
            <button type="submit" class="btn btn-danger w-100">Login as Admin</button>
        </form>
        <p class="text-center mt-3 text-muted small">Normal users iska use mat karna ❌</p>
    </div>

    <script>
        document.getElementById('adminLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            if (email === 'admin@bookmypandit.com' && password === 'admin123') {
                localStorage.setItem('adminLoggedIn', 'true');
                alert('Admin login successful! Full control unlocked 🔥');
                window.location.href = 'admin-dashboard.html';
            } else {
                alert('Galat credentials! Sirf CEO allowed 👑');
            }
        });
    </script>
</body>
</html>
