<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login - BookMyPandit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(to bottom, #1a252f, #0f1a24); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 40px; max-width: 450px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center mb-4">Admin Login 👑</h2>
        <form id="adminLogin">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" value="admin@bookmypandit.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" value="admin123" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 btn-lg">Login as CEO</button>
        </form>
    </div>

    <script>
        document.getElementById('adminLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.querySelector('input[type="email"]').value;
            const password = document.querySelector('input[type="password"]').value;

            if (email === 'admin@bookmypandit.com' && password === 'admin123') {
                localStorage.setItem('adminLoggedIn', 'true');
                alert('Welcome CEO! Full control unlocked 🔥');
                window.location.href = 'admin-dashboard.html';
            } else {
                alert('Wrong credentials! Only CEO allowed 👑');
            }
        });
    </script>
</body>
</html>
