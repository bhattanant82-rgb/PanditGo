<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - BookMyPandit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #000, #1a0000); color: #f5e6c8; min-height: 100vh; }
        .login-box { max-width: 450px; margin: 150px auto; background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); border-radius: 25px; padding: 50px; box-shadow: 0 20px 50px rgba(255,153,51,0.2); border: 1px solid #ff9933; }
        h2 { font-family: 'Playfair Display', serif; color: #ff9933; text-align: center; margin-bottom: 40px; }
        .form-control { background: rgba(255,255,255,0.1); border: 1px solid #ff9933; color: #fff; border-radius: 12px; padding: 14px; }
        .form-control:focus { background: rgba(255,255,255,0.2); border-color: #ffd27f; box-shadow: 0 0 0 0.25rem rgba(255,153,51,0.3); }
        .btn-login { background: linear-gradient(135deg, #ff9933, #ffd27f); border: none; font-weight: 600; padding: 14px; border-radius: 50px; transition: all 0.3s; }
        .btn-login:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255,153,51,0.5); }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Admin Panel</h2>

    <form id="adminLoginForm">
        <div class="mb-4">
            <label for="adminEmail" class="form-label">Admin Email</label>
            <input type="email" class="form-control" id="adminEmail" placeholder="admin@bookmypandit.com" required>
        </div>

        <div class="mb-4">
            <label for="adminPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="adminPassword" placeholder="Enter admin password" required>
        </div>

        <button type="submit" class="btn btn-login w-100">Login to Admin</button>
    </form>

    <p class="text-center mt-4 text-muted">Only authorized admin access allowed</p>
</div>

<script>
    document.getElementById("adminLoginForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const email = document.getElementById("adminEmail").value;
        const password = document.getElementById("adminPassword").value;

        // Simple demo check (real me backend se verify karna)
        if (email === "admin@bookmypandit.com" && password === "admin123") {
            alert("Admin login successful!");
            window.location.href = "admin-dashboard.html";
        } else {
            alert("Invalid credentials! Try again.");
        }
    });
</script>
</body>
</html>
