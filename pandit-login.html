<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandit Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        .login-title { text-align: center; margin-bottom: 30px; }
        .btn-primary { width: 100%; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 class="login-title">Pandit Login</h2>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="credential" class="form-label">Email or Phone</label>
                <input type="text" class="form-control" id="credential" placeholder="pandit1@example.com or 9876543210" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <p class="text-center mt-3 text-danger" id="errorMsg" style="display:none;">
            Wrong credentials or account not approved yet
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const cred = document.getElementById('credential').value.trim();
            const pass = document.getElementById('password').value.trim();
            const error = document.getElementById('errorMsg');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: cred, password: pass })
            });
            const data = await res.json();
            if (data.success && data.role === 'pandit') {
                localStorage.setItem('token', data.token);
                window.location.href = "pandit-dashboard.html";
            } else {
                error.style.display = 'block';
            }
        });
        });
    </script>
</body>
</html>
