<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandit Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        .login-title { text-align: center; margin-bottom: 30px; color: #333; }
        .btn-primary { width: 100%; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2 class="login-title">Pandit Login</h2>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email or Phone</label>
                <input type="text" class="form-control" id="email" placeholder="Enter email or phone" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <p class="text-center mt-3 text-danger" id="errorMsg" style="display:none;">
            Invalid credentials or account not approved
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // form submit rok do

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            // Abhi dummy check (real me backend se aayega)
            if (email !== '' && password !== '') {
                // Success → dashboard pe le jao
                window.location.href = "dashboard.html";   // ya full path: "/pandit/dashboard.html"
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
