<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - PanditGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Admin Dashboard</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Update Cosmic Data</div>
                    <div class="card-body">
                        <form id="cosmic-form">
                            <div class="mb-3">
                                <label>Tithi</label>
                                <input type="text" class="form-control" id="tithi-input" value="Shukla Paksha Dwitiya">
                            </div>
                            <div class="mb-3">
                                <label>Active Grah</label>
                                <input type="text" class="form-control" id="grah-input" value="Mars">
                            </div>
                            <div class="mb-3">
                                <label>Rahu/Ketu Alert</label>
                                <input type="text" class="form-control" id="alert-input" value="Rahu in 7th house">
                            </div>
                            <div class="mb-3">
                                <label>High Consultation Day</label>
                                <input type="checkbox" id="consultation-input" checked>
                            </div>
                            <button type="submit" class="btn btn-primary">Update Cosmic Data</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Update Platform Stats</div>
                    <div class="card-body">
                        <form id="stats-form">
                            <div class="mb-3">
                                <label>Pandits Online</label>
                                <input type="number" class="form-control" id="pandits-input" value="127">
                            </div>
                            <div class="mb-3">
                                <label>Consultations Today</label>
                                <input type="number" class="form-control" id="consultations-input" value="1482">
                            </div>
                            <div class="mb-3">
                                <label>Average Rating</label>
                                <input type="number" step="0.1" class="form-control" id="rating-input" value="4.8">
                            </div>
                            <button type="submit" class="btn btn-primary">Update Stats</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update Cosmic Data
        document.getElementById('cosmic-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = {
                tithi: document.getElementById('tithi-input').value,
                active_grah: document.getElementById('grah-input').value,
                rahu_ketu_alert: document.getElementById('alert-input').value,
                high_consultation_day: document.getElementById('consultation-input').checked
            };
            
            try {
                const response = await fetch('data/cosmic_today.json', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                alert('Cosmic data updated!');
            } catch (error) {
                alert('Error updating data');
            }
        });

        // Update Stats
        document.getElementById('stats-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = {
                pandits_online: parseInt(document.getElementById('pandits-input').value),
                consultations_today: parseInt(document.getElementById('consultations-input').value),
                average_rating: parseFloat(document.getElementById('rating-input').value)
            };
            
            try {
                const response = await fetch('data/platform_stats.json', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                alert('Stats updated!');
            } catch (error) {
                alert('Error updating stats');
            }
        });
    </script>
</body>
</html>
