<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandit Dashboard - BookMyPandit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->

    <section class="py-5">
        <div class="container">
            <h1 class="text-center text-primary mb-5">Pandit Dashboard</h1>

            <!-- Current Booking Card -->
            <div class="card shadow p-4">
                <h4>Upcoming Booking</h4>
                <p><strong>Customer:</strong> Raj Patel</p>
                <p><strong>Puja:</strong> Griha Pravesh</p>
                <p><strong>Address:</strong> Navrangpura, Ahmedabad</p>
                <p><strong>Date:</strong> 30 Dec 2025 • 10 AM</p>

                <button id="startJourney" class="btn btn-success btn-lg rounded-pill px-5 mt-3">Start Journey (Enable GPS)</button>
                <button id="reachedBtn" class="btn btn-primary btn-lg rounded-pill px-5 mt-3" style="display:none;">Reached Location</button>
            </div>

            <div id="pinSection" class="mt-4" style="display:none;">
                <label>Enter Arrival PIN from Customer:</label>
                <input type="text" id="arrivalPin" class="form-control w-50 d-inline" maxlength="4">
                <button id="verifyPin" class="btn btn-warning rounded-pill ms-3">Verify PIN</button>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/tracking.js"></script>
</body>
</html>
