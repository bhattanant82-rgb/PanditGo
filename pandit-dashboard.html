<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandit Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
        }
        .sidebar {
            background-color: #343a40;
            height: 100vh;
            padding: 20px;
            color: white;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .main-content {
            padding: 40px;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        .card-body {
            font-size: 2rem;
            text-align: center;
        }
        .logout {
            position: absolute;
            bottom: 20px;
            width: calc(100% - 40px);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Navigation -->
            <div class="col-md-2 sidebar">
                <h4 class="text-center mb-4">Pandit Panel</h4>
                <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                <a href="bookings.html"><i class="fas fa-calendar-alt"></i> My Bookings</a>
                <a href="earnings.html"><i class="fas fa-rupee-sign"></i> Earnings</a>
                <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
                <a href="/logout" class="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <h2 class="mb-4">Welcome to Your Dashboard</h2>
                <div class="row">
                    <!-- Today's Bookings Card -->
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-header">Today's Bookings</div>
                            <div class="card-body">2</div>  <!-- Dummy data -->
                        </div>
                    </div>
                    <!-- Upcoming Bookings Card -->
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-header">Upcoming Bookings</div>
                            <div class="card-body">5</div>  <!-- Dummy data -->
                        </div>
                    </div>
                    <!-- Total Completed Pujas Card -->
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-header">Total Completed Pujas</div>
                            <div class="card-body">45</div>  <!-- Dummy data -->
                        </div>
                    </div>
                    <!-- Total Earnings Card -->
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-header">Total Earnings</div>
                            <div class="card-body">₹ 12,500</div>  <!-- Dummy data -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
