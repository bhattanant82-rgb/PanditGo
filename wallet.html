<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Top-up - PanditGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wallet-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        .amount-btn {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            margin: 5px;
            transition: all 0.3s ease;
        }
        .amount-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(255,107,107,0.3);
        }
        .amount-btn.active {
            background: linear-gradient(45deg, #4CAF50, #45B649);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wallet-card text-center">
            <h2 class="mb-4">💰 Top-up Your Wallet</h2>
            <div class="mb-4">
                <h4>Current Balance: <span id="current-balance">₹0</span></h4>
            </div>
            
            <div class="mb-4">
                <h5>Select Amount</h5>
                <div class="d-flex flex-wrap justify-content-center">
                    <button class="btn amount-btn" data-amount="100">₹100</button>
                    <button class="btn amount-btn" data-amount="500">₹500</button>
                    <button class="btn amount-btn" data-amount="1000">₹1000</button>
                    <button class="btn amount-btn" data-amount="2000">₹2000</button>
                    <button class="btn amount-btn" data-amount="5000">₹5000</button>
                </div>
            </div>
            
            <div class="mb-4">
                <input type="number" class="form-control text-center" id="custom-amount" placeholder="Or enter custom amount">
            </div>
            
            <button class="btn btn-success btn-lg px-5" id="pay-btn" disabled>Pay Now</button>
        </div>
    </div>

    <script>
        const userId = 22; // Should come from auth
        let selectedAmount = 0;

        // Load current balance
        async function loadBalance() {
            try {
                const response = await fetch(`http://localhost:3000/api/wallet/${userId}`);
                const data = await response.json();
                document.getElementById('current-balance').textContent = `₹${data.balance}`;
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        // Amount selection
        document.querySelectorAll('.amount-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedAmount = parseInt(this.dataset.amount);
                document.getElementById('custom-amount').value = '';
                document.getElementById('pay-btn').disabled = false;
            });
        });

        // Custom amount
        document.getElementById('custom-amount').addEventListener('input', function() {
            selectedAmount = parseInt(this.value) || 0;
            document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('pay-btn').disabled = selectedAmount <= 0;
        });

        // Payment
        document.getElementById('pay-btn').addEventListener('click', function() {
            if (selectedAmount > 0) {
                // Razorpay integration placeholder
                const options = {
                    key: 'YOUR_RAZORPAY_KEY', // Replace with actual key
                    amount: selectedAmount * 100, // Amount in paisa
                    currency: 'INR',
                    name: 'PanditGo',
                    description: 'Wallet Top-up',
                    handler: function(response) {
                        // On successful payment
                        topupWallet(response.razorpay_payment_id);
                    },
                    prefill: {
                        name: 'User Name',
                        email: 'user@example.com',
                        contact: '9999999999'
                    },
                    theme: {
                        color: '#FF9933'
                    }
                };
                const rzp = new Razorpay(options);
                rzp.open();
            }
        });

        async function topupWallet(paymentId) {
            try {
                const response = await fetch('http://localhost:3000/api/wallet-topup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        amount: selectedAmount,
                        razorpay_payment_id: paymentId
                    })
                });
                const data = await response.json();
                if (data.success) {
                    alert(`Wallet topped up successfully! New balance: ₹${data.new_balance}`);
                    loadBalance();
                }
            } catch (error) {
                console.error('Error topping up wallet:', error);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadBalance);
    </script>
</body>
</html>
