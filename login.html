<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanditGo – Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #fffaf0, #ffe4d9); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
        }
        .login-card { 
            max-width: 420px; 
            margin: auto; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 15px 40px rgba(255,153,51,0.2); 
        }
        .card-header { 
            background: linear-gradient(90deg, #FF9933, #FF4500); 
            color: white; 
            text-align: center; 
            padding: 50px 20px; 
        }
        .card-header h2 { 
            font-family: 'Playfair Display', serif; 
            font-size: 3rem; 
            margin: 0; 
        }
        .btn-login { 
            background: #FF9933; 
            border: none; 
            font-weight: bold; 
            padding: 12px; 
            width: 100%; 
        }
        .btn-login:hover { background: #e67e22; }
        .error-msg { color: #dc3545; text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="login-card card">
        <div class="card-header">
            <h2>Namaste 🙏</h2>
            <p class="lead mt-2">Login to Your PanditGo Account</p>
        </div>
        <div class="card-body p-5">
            <form id="loginForm">
                <div class="mb-4">
                    <label class="form-label fw-bold">Email or Phone</label>
                    <input type="text" id="identifier" class="form-control form-control-lg" placeholder="example@email.com or 9876543210" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" id="password" class="form-control form-control-lg" placeholder="••••••••" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-login btn-lg text-white">Login</button>
                </div>
                <div class="text-center mt-4">
                    <a href="#" class="text-danger">Forgot Password?</a><br><br>
                    <small>New User? <a href="signup.html" class="text-warning fw-bold">Sign Up Now</a></small>
                </div>
                <p id="errorMsg" class="error-msg" style="display:none;"></p>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const identifier = document.getElementById('identifier').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!identifier || !password) {
            showError('Pura form bharo bhai!');
            return;
        }

        try {
            const res = await fetch('http://localhost:5000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password })
            });

            const data = await res.json();

            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('userName', data.name || 'User');

                // Role-based redirection
                if (data.role === 'admin') {
                    window.location.href = 'admin-dashboard/admin.html';
                } else if (data.role === 'pandit') {
                    window.location.href = 'pandit-dashboard.html';
                } else {
                    window.location.href = 'my-dashboard.html';  // Customer dashboard
                }
            } else {
                showError(data.message || 'Galat email/phone ya password!');
            }
        } catch (err) {
            showError('Server se connection nahi ho raha... (Flask chalao!)');
            console.error(err);
        }
    });

    function showError(msg) {
        const errorEl = document.getElementById('errorMsg');
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
    }
</script>
</body>
</html>
