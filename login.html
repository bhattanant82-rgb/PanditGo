<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PanditGo - Customer Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body { background: linear-gradient(135deg, #fffaf0, #ffe4d9); }
        .login-box { max-width: 420px; margin: 100px auto; }
        .card { border-radius: 20px; overflow: hidden; box-shadow: 0 15px 40px rgba(255, 153, 51, 0.2); }
        .card-header { background: linear-gradient(90deg, #FF9933, #FF4500); color: white; text-align: center; padding: 40px 20px; }
        .card-header h2 { font-family: 'Playfair Display', serif; font-size: 2.8rem; margin: 0; }
        .btn-login { background: #FF9933; border: none; font-weight: bold; padding: 12px; }
        .btn-login:hover { background: #e67e22; }
    </style>
</head>
<body>

<!-- Navbar same as index -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3 text-danger position-absolute start-0 ms-4" href="index.html">PanditGo</a>
        <!-- ... rest of navbar same ... -->
        <div class="d-flex gap-3 position-absolute end-0 me-4">
            <a href="login.html" class="btn btn-outline-danger rounded-pill px-4 active">Login</a>
            <a href="signup.html" class="btn btn-warning rounded-pill px-4">Sign Up</a>
        </div>
    </div>
</nav>

<div class="login-box">
    <div class="card">
        <div class="card-header">
            <h2>Namaste 🙏</h2>
            <p class="lead mt-2">Login to Book Your Puja</p>
        </div>
        <div class="card-body p-5">
            <form id="customerLoginForm">
                <div class="mb-4">
                    <label class="form-label fw-bold">Email or Mobile</label>
                    <input type="text" id="identifier" class="form-control form-control-lg" placeholder="example@email.com or 9876543210" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" id="password" class="form-control form-control-lg" placeholder="••••••••" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-login btn-lg text-white">Login as Customer</button>
                </div>

                <div class="text-center mt-4">
                    <a href="#" class="text-danger">Forgot Password?</a><br><br>
                    <small>New User? <a href="signup.html" class="text-warning fw-bold">Sign Up Now</a></small>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Footer same -->
<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p>© 2026 PanditGo – All Rights Reserved</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('customerLoginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const identifier = document.getElementById('identifier').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!identifier || !password) {
            alert('Bhai pura form bhar de!');
            return;
        }

        // Simple mock success (real me backend call karna)
        if (password.length >= 6) {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userType', 'customer');
            localStorage.setItem('userId', identifier); // email ya mobile

            alert('Login successful! Welcome to your dashboard 🙏');
            window.location.href = 'my-dashboard.html';  // ya my-bookings.html jo tera main page hai
        } else {
            alert('Galat password ya email/mobile!');
        }
    });
    // Page load pe check kar login hai ya nahi
    if (localStorage.getItem('isLoggedIn') !== 'true' || localStorage.getItem('userType') !== 'customer') {
        alert('Login kar pehle bhai!');
        window.location.href = 'login.html';
    }

    // Logout function (button me onclick laga dena)
    function logout() {
        if (confirm('Logout kar rahe ho?')) {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    }
</script>
</body>
</html>
