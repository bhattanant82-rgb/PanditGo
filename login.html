<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login • Premium</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: #0a0a12;
      --surface: #111827;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #a78bfa;
      --border: #2d3348;
      --glow: rgba(99, 102, 241, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(99,102,241,0.07) 0%, transparent 60%),
        radial-gradient(circle at 85% 75%, rgba(167,139,250,0.05) 0%, transparent 60%);
    }

    /* ── NAVBAR (same as signup page) ── */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 5%;
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(90deg, #c084fc, #818cf8, #6366f1);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -1px;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.2rem;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-auth-btn {
      padding: 0.55rem 1.4rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 0.6rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-auth-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    /* ── LOGIN SECTION ── */
    main {
      padding-top: 120px; /* space for fixed navbar */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 1rem 4rem;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .auth-card {
      background: var(--surface);
      border-radius: 1.25rem;
      border: 1px solid var(--border);
      padding: 2.8rem 2.2rem;
      box-shadow: 0 20px 50px -12px rgba(0,0,0,0.65),
                  inset 0 0 0 1px rgba(99,102,241,0.08);
      backdrop-filter: blur(8px);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
      letter-spacing: -0.5px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 2.2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 0.6rem;
      font-size: 0.92rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 1rem 1.2rem;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      color: var(--text);
      font-size: 1rem;
      transition: all 0.25s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--glow);
      background: rgba(30, 41, 59, 0.9);
    }

    .forgot-link {
      display: block;
      text-align: right;
      color: var(--accent);
      font-size: 0.9rem;
      text-decoration: none;
      margin-top: -0.4rem;
      margin-bottom: 1.2rem;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 1.1rem;
      margin-top: 1rem;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(99,102,241,0.4);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 2rem 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider span {
      padding: 0 1.5rem;
    }

    .social-btn {
      width: 100%;
      padding: 1rem;
      margin-bottom: 1rem;
      background: rgba(30,41,59,0.4);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      transition: all 0.25s;
    }

    .social-btn:hover {
      background: rgba(30,41,59,0.7);
      border-color: var(--primary);
    }

    .toggle-auth {
      text-align: center;
      margin-top: 1.8rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .toggle-auth a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .toggle-auth a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 2rem 1.5rem;
      }
      .nav-links {
        gap: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR (same as signup) -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">LUXE</a>
      
      <div class="nav-links">
        <a href="/features">Features</a>
        <a href="/pricing">Pricing</a>
        <a href="/about">About</a>
        <a href="/signup">Sign Up</a>
        <button class="nav-auth-btn">Login</button>
      </div>
    </div>
  </nav>

  <!-- LOGIN FORM -->
  <main>
    <div class="login-container">
      <div class="auth-card">
        <div class="logo-area">
          <div class="logo" style="font-size:2.8rem;">LUXE</div>
        </div>

        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to your account</p>

        <form>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="hello@example.com" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="divider"><span>or</span></div>

        <button class="social-btn">
          <i class="fa-brands fa-google"></i> Continue with Google
        </button>

        <p class="toggle-auth">
          Don't have an account? <a href="/signup">Create one</a>
        </p>
      </div>
    </div>
  </main>

  <script>
    // Optional: Password visibility toggle (same as signup page)
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.createElement('i');
    toggleIcon.className = 'fa-solid fa-eye password-toggle';
    toggleIcon.style.position = 'absolute';
    toggleIcon.style.right = '1.2rem';
    toggleIcon.style.top = '2.6rem';
    toggleIcon.style.cursor = 'pointer';
    toggleIcon.style.color = 'var(--text-muted)';
    toggleIcon.style.fontSize = '1.15rem';

    const passwordGroup = document.querySelector('.form-group:last-of-type');
    passwordGroup.style.position = 'relative';
    passwordGroup.appendChild(toggleIcon);

    toggleIcon.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });
  </script>

</body>
</html>
