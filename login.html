<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookMyPandit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #1a0000, #3b0a0a); color: #f5e6c8; min-height: 100vh; }
        .login-container { max-width: 450px; margin: 100px auto; background: rgba(255,255,255,0.07); backdrop-filter: blur(15px); border-radius: 25px; padding: 50px 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,153,51,0.2); }
        h2 { font-family: 'Playfair Display', serif; color: #ffcc66; text-align: center; margin-bottom: 40px; }
        .form-label { color: #ffd27f; font-weight: 500; }
        .form-control { background: rgba(255,255,255,0.1); border: 1px solid #ff9933; color: #fff; border-radius: 12px; padding: 14px; }
        .form-control:focus { background: rgba(255,255,255,0.15); border-color: #ffd27f; box-shadow: 0 0 0 0.25rem rgba(255,153,51,0.25); color: #fff; }
        .form-control::placeholder { color: rgba(255,255,255,0.6); }
        .btn-login { background: linear-gradient(135deg, #ff9933, #ffd27f); border: none; font-weight: 600; padding: 14px; border-radius: 50px; transition: all 0.3s; }
        .btn-login:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,153,51,0.4); }
        .social-btn { background: rgba(255,255,255,0.1); border: 1px solid #ff9933; color: #ffd27f; border-radius: 50px; padding: 12px 20px; transition: all 0.3s; }
        .social-btn:hover { background: rgba(255,153,51,0.2); }
        .link-text { color: #ffd27f; text-decoration: none; }
        .link-text:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Welcome Back</h2>

    <form id="loginForm">
        <div class="mb-4">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
        </div>

        <div class="d-flex justify-content-between mb-4">
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <a href="#" class="link-text">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-login w-100 mb-4">Login</button>

        <div class="divider text-center my-4">
            <span>OR</span>
        </div>

        <div class="d-grid gap-3">
            <button type="button" class="btn social-btn"><i class="fab fa-google me-2"></i> Login with Google</button>
            <button type="button" class="btn social-btn"><i class="fab fa-facebook-f me-2"></i> Login with Facebook</button>
        </div>

        <p class="text-center mt-4">
            Don't have an account? <a href="signup.html" class="link-text">Sign Up</a>
        </p>
    </form>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (email && password) {
            // Future me backend call kar sakte hain
            alert("Login successful! Redirecting to Dashboard...");
            window.location.href = "my-dashboard.html"; // Dashboard page pe le jayega
        } else {
            alert("Please fill all fields!");
        }
    });
</script>
</body>
</html>
