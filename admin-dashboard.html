<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PanditGo - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #0f0f1a; color: white; }
        .card { background: #1a1a2e; border-radius: 15px; }
        .btn-admin { border-radius: 50px; }
    </style>
</head>
<body>

<nav class="navbar bg-dark">
    <div class="container">
        <a class="navbar-brand text-warning" href="#">Admin Panel</a>
        <button onclick="logout()" class="btn btn-outline-danger">Logout</button>
    </div>
</nav>

<div class="container my-5">
    <div class="row g-4">
        <!-- Bookings -->
        <div class="col-md-4">
            <div class="card p-4">
                <h5 class="text-green">Bookings Management</h5>
                <button class="btn btn-outline-success btn-admin w-100 mb-2" onclick="viewAllBookings()">View All Bookings</button>
                <button class="btn btn-outline-warning btn-admin w-100 mb-2" onclick="pendingApprovals()">Pending Approvals</button>
                <button class="btn btn-outline-danger btn-admin w-100" onclick="forceRefund()">Force Refund / Cancel</button>
            </div>
        </div>

        <!-- Pandit -->
        <div class="col-md-4">
            <div class="card p-4">
                <h5 class="text-blue">Pandit Management</h5>
                <button class="btn btn-outline-info btn-admin w-100 mb-2" onclick="newPanditApps()">New Applications</button>
                <button class="btn btn-outline-primary btn-admin w-100 mb-2" onclick="activePandits()">Active Pandits</button>
                <button class="btn btn-outline-danger btn-admin w-100" onclick="blockPandit()">Block Pandit</button>
            </div>
        </div>

        <!-- User -->
        <div class="col-md-4">
            <div class="card p-4">
                <h5 class="text-yellow">User Management</h5>
                <button class="btn btn-outline-warning btn-admin w-100 mb-2" onclick="viewUsers()">View Users</button>
                <button class="btn btn-outline-secondary btn-admin w-100 mb-2" onclick="manualBooking()">Manual Booking</button>
                <button class="btn btn-outline-danger btn-admin w-100" onclick="blockUser()">Block User</button>
            </div>
        </div>

        <!-- Payment -->
        <div class="col-md-6">
            <div class="card p-4">
                <h5 class="text-blue">Payment Control</h5>
                <button class="btn btn-outline-primary btn-admin w-100 mb-2" onclick="paymentReports()">Payment Reports</button>
                <button class="btn btn-outline-green btn-admin w-100 mb-2" onclick="manualRefund()">Manual Refund</button>
                <button class="btn btn-outline-cyan btn-admin w-100" onclick="settlementReports()">Settlement Reports</button>
            </div>
        </div>

        <!-- Puja & Content -->
        <div class="col-md-6">
            <div class="card p-4">
                <h5 class="text-gray">Puja & Content</h5>
                <button class="btn btn-outline-dark btn-admin w-100 mb-2" onclick="editPuja()">Add / Edit Puja</button>
                <button class="btn btn-outline-yellow btn-admin w-100 mb-2" onclick="surgePricing()">Surge Pricing</button>
                <button class="btn btn-outline-orange btn-admin w-100" onclick="blogOffers()">Blog & Offers</button>
            </div>
        </div>

        <!-- Security -->
        <div class="col-12">
            <div class="card p-4">
                <h5 class="text-red">Security & Settings</h5>
                <button class="btn btn-outline-red btn-admin w-100 mb-2" onclick="fraudLogs()">Fraud Logs</button>
                <button class="btn btn-outline-yellow btn-admin w-100 mb-2" onclick="changeCommission()">Change Commission</button>
                <button class="btn btn-outline-dark btn-admin w-100" onclick="maintenanceMode()">Maintenance Mode</button>
            </div>
        </div>
    </div>
</div>

<script>
    if (localStorage.getItem('admin_logged_in') !== 'true') {
        window.location.href = 'admin-login.html';
    }

    async function viewAllBookings() {
        const res = await fetch('/api/admin/bookings');
        const data = await res.json();
        alert('Bookings: ' + JSON.stringify(data, null, 2));
    }

    async function pendingApprovals() {
        alert('Pending Bookings Loaded!');
        // Real API call
    }

    async function forceRefund() {
        const bookingId = prompt('Booking ID for Refund:');
        if (bookingId) {
            const res = await fetch('/api/admin/booking/refund', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({payment_id: 'pay_example', amount: 4999})
            });
            const data = await res.json();
            alert(data.message || 'Refund Done');
        }
    }

    // Similar functions for other buttons
    async function newPanditApps() {
        const res = await fetch('/api/admin/pandits/applications');
        const data = await res.json();
        alert('New Applications: ' + JSON.stringify(data, null, 2));
    }

    async function activePandits() {
        alert('Active Pandits List Loaded!');
    }

    async function blockPandit() {
        const id = prompt('Pandit ID to Block:');
        if (id) {
            alert('Pandit Blocked!');
        }
    }

    async function viewUsers() {
        const res = await fetch('/api/admin/users');
        const data = await res.json();
        alert('Users: ' + JSON.stringify(data, null, 2));
    }

    async function manualBooking() {
        alert('Manual Booking Created!');
    }

    async function blockUser() {
        const id = prompt('User ID to Block:');
        if (id) {
            alert('User Blocked!');
        }
    }

    async function paymentReports() {
        const res = await fetch('/api/admin/payments/reports');
        const data = await res.json();
        alert('Payment Reports: ' + JSON.stringify(data, null, 2));
    }

    async function manualRefund() {
        alert('Manual Refund Triggered!');
    }

    async function settlementReports() {
        alert('Settlement Reports Generated!');
    }

    async function editPuja() {
        const id = prompt('Puja ID to Edit:');
        const name = prompt('New Puja Name:');
        const price = prompt('New Price:');
        if (id && name && price) {
            const res = await fetch('/api/admin/puja/edit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id, name, price})
            });
            const data = await res.json();
            alert(data.message);
        }
    }

    async function surgePricing() {
        alert('Surge Pricing Set!');
    }

    async function blogOffers() {
        alert('Blog & Offers Updated!');
    }

    async function fraudLogs() {
        alert('Fraud Logs Loaded!');
    }

    async function changeCommission() {
        alert('Commission Changed!');
    }

    async function maintenanceMode() {
        alert('Maintenance Mode ON!');
    }

    function logout() {
        fetch('/api/admin/logout', {method: 'POST'});
        localStorage.clear();
        window.location.href = 'admin-login.html';
    }
</script>
</body>
</html>
