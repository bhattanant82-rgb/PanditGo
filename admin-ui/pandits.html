<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanditGo CMS - Pandits</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .form-group { margin-bottom: 10px; }
        label { display: block; }
        input, select { width: 100%; padding: 8px; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        .form-container { max-width: 600px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Pandits Management</h1>
    <div class="form-container">
        <h2>Add Pandit</h2>
        <form id="addPanditForm">
            <div class="form-group">
                <label>Name:</label>
                <input name="name" required>
            </div>
            <div class="form-group">
                <label>Photo URL:</label>
                <input name="photo">
            </div>
            <div class="form-group">
                <label>City:</label>
                <input name="city" required>
            </div>
            <div class="form-group">
                <label>Languages (comma separated):</label>
                <input name="languages">
            </div>
            <div class="form-group">
                <label>Experience (years):</label>
                <input name="experience" type="number">
            </div>
            <div class="form-group">
                <label>Specialization:</label>
                <input name="specialization">
            </div>
            <div class="form-group">
                <label>Chat Price/min:</label>
                <input name="chat_price_per_min" type="number" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Call Price/min:</label>
                <input name="call_price_per_min" type="number" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Availability:</label>
                <select name="availability">
                    <option value="online">Online</option>
                    <option value="offline">Offline</option>
                </select>
            </div>
            <div class="form-group">
                <label>Phone:</label>
                <input name="phone">
            </div>
            <button type="submit">Add Pandit</button>
        </form>
    </div>
    <h2>All Pandits</h2>
    <table id="panditsTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>City</th>
                <th>Availability</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script src="js/pandits.js"></script>
</body>
</html>
